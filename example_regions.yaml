aladin_cmd: Aladin.jar  # Caminho para o Aladin
cwd: /tmp/proc_regions
max_mem: 4

hipsgen:
  creator_did: CDS/P/EXAMPLE/SURVEY
  maxthread: 8
  hips_creator: LIneA
  obs_title: 'Example Survey with Regions'

  runs:
    blue:
      input_dir: /path/to/input_g
      output_dir: output_g
      pixelcut: "-1.2 400 asinh"
      mode: mean
      cache: tmp_g
    red:
      input_dir: /path/to/input_i
      output_dir: output_i
      pixelcut: "-1 400 asinh"
      mode: mean
      cache: tmp_i
    green:
      input_dir: /path/to/input_r
      output_dir: output_r
      pixelcut: "-1.2 400 asinh"
      mode: mean
      cache: tmp_r
    rgb:
      luptonM: "0.02/0.02/0.02"
      luptonS: "0.005/0.005/0.007"
      luptonQ: "30/30/30"
      output_dir: output_rgb