aladin_cmd: Aladin.jar  # Aladin path
dryrun: true
output_dir: /tmp/output/
inputs:
  path_regex: /mnt/EXT4/datasets/DC2/images/*.fits
  max_images: 3
  pattern:
    g: "-g-" # ".*-g-.*.fits$"
    r: "-r-" # ".*-r-.*.fits$"
    i: "-i-" # ".*-i-.*.fits$"
max_mem: 2

hipsgen:
  creator_did: CDS/P/DES/DC2
  maxthread: 10
  hips_creator: LIneA
  obs_title: 'DES DC2'

  runs:
    blue:
      pixelcut: "-1.2 400 asinh"
      mode: mean
    red:
      pixelcut: "-1 400 asinh"
      mode: mean
    green:
      pixelcut: "-1.2 400 asinh"
      mode: mean
    rgb:
      luptonM: "0.03/0.03/0.03" # Brightness
      luptonS: "0.4/0.4/0.4" # Saturation
      luptonQ: "40000/40000/40000" # Contrast
