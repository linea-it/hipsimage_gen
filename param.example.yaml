aladin_cmd: Aladin.jar  # Aladin path
dryrun: true
output_dir: /mnt/EXT4/hips/dc2/test02
max_mem: 2

hipsgen:
  creator_did: CDS/P/DES/DR2
  maxthread: 10
  hips_creator: LIneA
  obs_title: 'DES DR2'

  runs:
    index:
      in: /mnt/EXT4/datasets/dr2_images/
    blue:
      in: /mnt/EXT4/datasets/dr2_images/g
      pixelcut: "-1.2 400 asinh"
    red:
      in: /mnt/EXT4/datasets/dr2_images/i
      pixelcut: "-1 400 asinh"
    green:
      in: /mnt/EXT4/datasets/dr2_images/r
      pixelcut: "-1.2 400 asinh"
    rgb:
      luptonM: "0.03/0.03/0.03" # Brightness
      luptonS: "0.4/0.4/0.4" # Saturation
      luptonQ: "40000/40000/40000" # Contrast
    concat:
      mode: overwrite