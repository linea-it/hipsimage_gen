aladin_cmd: /path/to/Aladin.jar
cwd: /tmp/hips_offline
max_mem: 4

hipsgen:
  creator_did: CDS/P/LSST/DR2
  maxthread: 8
  hips_creator: LIneA
  obs_title: 'LSST DR2 - Offline Processing'
  
  # Configurações para modo offline
  hips_service_url: ""               # Desabilita serviços online
  client_category: ""                # Remove categoria de cliente
  client_application: "HipsGen"      # Aplicação local
  
  # Template local (se disponível)
  template_path: "/home/singulani/projects/hipsimage_gen/templates/hips-landing-page-template.html"

  runs:
    blue:
      input_dir: /mnt/EXT4/datasets/decompressed
      output_dir: output_g
      pixelcut: "-1.2 400 asinh"
      mode: mean
      cache: tmp_g
    red:
      input_dir: /mnt/EXT4/datasets/decompressed
      output_dir: output_i
      pixelcut: "-1 400 asinh"
      mode: mean
      cache: tmp_i
    green:
      input_dir: /mnt/EXT4/datasets/decompressed
      output_dir: output_r
      pixelcut: "-1.2 400 asinh"
      mode: mean
      cache: tmp_r
    rgb:
      luptonM: "0.02/0.02/0.02"
      luptonS: "0.005/0.005/0.007"
      luptonQ: "30/30/30"
      output_dir: output_rgb