aladin_cmd: /path/to/Aladin.jar  # Caminho completo para Aladin
cwd: /tmp/hips_partitioned
max_mem: 4

hipsgen:
  creator_did: CDS/P/LSST/DR2
  maxthread: 8  # Por partição - pode ser menor que antes
  hips_creator: LIneA
  obs_title: 'LSST DR2 - Partitioned Processing'

  runs:
    blue:
      input_dir: /data/lsst/g_band      # Diretório BASE - script encontrará as partições
      output_dir: output_g
      pixelcut: "-1.2 400 asinh"
      mode: mean
      cache: tmp_g
    red:
      input_dir: /data/lsst/i_band      # Diretório BASE - script encontrará as partições
      output_dir: output_i
      pixelcut: "-1 400 asinh"
      mode: mean
      cache: tmp_i
    green:
      input_dir: /data/lsst/r_band      # Diretório BASE - script encontrará as partições  
      output_dir: output_r
      pixelcut: "-1.2 400 asinh"
      mode: mean
      cache: tmp_r
    rgb:
      luptonM: "0.02/0.02/0.02"
      luptonS: "0.005/0.005/0.007"
      luptonQ: "30/30/30"
      output_dir: output_rgb